[project]
name = "auto-office-editor-mcp"
version = "0.1.0"
description = "MCP server for automating Office (Excel/Word/PowerPoint) via Win32com"
requires-python = ">=3.11"
dependencies = [
    "pywin32",
    "fastmcp",
    "pandas",
    "numpy",
    "pymupdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[project.scripts]
auto-office-editor-mcp = "auto_office_editor_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_office_editor_mcp"]

[tool.pytest.ini_options]
timeout = 60
markers = [
    "integration: requires Office applications to be installed",
]
